<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Wochenplaner"/>
<meta name="theme-color" content="#FF6B35"/>
<title>Wochenplaner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F2F2F7;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.hdr{background:linear-gradient(135deg,#FF6B35,#FF8C61);padding:52px 20px 24px;color:#fff}
.hdr-sub{font-size:13px;font-weight:600;letter-spacing:2px;opacity:.85;text-transform:uppercase;margin-bottom:4px}
.hdr-title{font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:4px}
.hdr-btn{margin-top:14px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:20px;color:#fff;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.content{padding:16px 16px 0}
.card{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-row{display:flex;align-items:center;padding:12px 14px}
.icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px;flex-shrink:0}
.icon-active{background:linear-gradient(135deg,#FF6B35,#FF8C61)}
.icon-empty{background:#F2F2F7}
.day-label{font-size:12px;color:#8E8E93;font-weight:600;text-transform:uppercase}
.dish-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#FFF0EB;color:#FF6B35;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:500}
.tag-more{background:#F2F2F7;color:#8E8E93;border-radius:8px;padding:2px 8px;font-size:11px}
.btn-del{background:#FF3B30;border:none;border-radius:8px;color:#fff;width:30px;height:30px;font-size:14px;cursor:pointer;margin-right:6px}
.btn-add{background:#F2F2F7;border:none;border-radius:8px;color:#FF6B35;width:30px;height:30px;font-size:18px;cursor:pointer;font-weight:700}
.dish-btn{display:flex;align-items:center;width:100%;background:#fff;border:none;border-radius:16px;margin-bottom:10px;padding:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:left;font-family:inherit}
.dish-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#FF6B35,#FF8C61);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:14px;flex-shrink:0}
.badge{background:#E8F9F0;color:#34C759;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600}
.arrow{color:#C7C7CC;font-size:18px;margin-left:8px}
.shop-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #F2F2F7}
.shop-dot{width:8px;height:8px;border-radius:50%;background:#FF6B35;margin-right:12px;flex-shrink:0}
.shop-amt{font-size:15px;font-weight:600;color:#FF6B35}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);border-top:1px solid rgba(0,0,0,.08);display:flex;padding:8px 0 20px;z-index:100}
.tab-btn{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-family:inherit}
.tab-ico{font-size:22px}
.tab-lbl{font-size:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:500}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:20px 20px 40px}
.sheet-handle{width:36px;height:4px;background:#E5E5EA;border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:16px}
.sheet-close{background:#F2F2F7;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:#8E8E93;float:right}
.ing-row{display:flex;gap:6px;margin-bottom:6px}
.inp{padding:10px 12px;border-radius:12px;border:1px solid #E5E5EA;font-size:14px;outline:none;font-family:inherit;width:100%}
.sel{padding:10px;border-radius:10px;border:1px solid #E5E5EA;font-size:12px;outline:none;background:#fff;font-family:inherit}
.lbl{font-size:13px;color:#8E8E93;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px;margin-top:12px}
.save-btn{width:100%;background:linear-gradient(135deg,#FF6B35,#FF8C61);border:none;border-radius:12px;color:#fff;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit}
.del-btn{width:100%;background:#FF3B30;border:none;border-radius:12px;color:#fff;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit}
.empty{text-align:center;padding:60px 20px;color:#8E8E93}
.empty-ico{font-size:50px;margin-bottom:12px}
.empty-txt{font-size:17px;font-weight:600}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.9);color:#fff;border-radius:20px;padding:10px 20px;font-size:14px;font-weight:500;z-index:999;white-space:nowrap;pointer-events:none}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;background:#F8F8F8;border-radius:12px;padding:10px;margin-bottom:4px}
.emoji-btn{font-size:22px;background:transparent;border:none;border-radius:8px;width:36px;height:36px;cursor:pointer}
.emoji-btn.sel{background:#FF6B35}
.picker-btn{display:flex;align-items:center;width:100%;background:#F8F8F8;border:none;border-radius:12px;margin-bottom:8px;padding:12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:500}
.picker-btn.active{background:#FFF0EB}
.ing-detail{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F2F2F7}
</style>
</head>
<body>
<div id="app"></div>
<script>
var dishes = [
  {id:1,name:'Spaghetti Bolognese',emoji:'🍝',ings:[{n:'Spaghetti',a:'400',u:'g'},{n:'Hackfleisch',a:'500',u:'g'},{n:'Tomaten',a:'400',u:'g'},{n:'Zwiebel',a:'1',u:'Stk'},{n:'Knoblauch',a:'2',u:'Zehen'}]},
  {id:2,name:'Haehnchen Curry',emoji:'🍛',ings:[{n:'Haehnchenbrust',a:'600',u:'g'},{n:'Kokosmilch',a:'400',u:'ml'},{n:'Currypaste',a:'2',u:'EL'},{n:'Reis',a:'300',u:'g'}]},
  {id:3,name:'Gemuesesuppe',emoji:'🥣',ings:[{n:'Karotten',a:'3',u:'Stk'},{n:'Kartoffeln',a:'4',u:'Stk'},{n:'Bruehe',a:'1.5',u:'L'},{n:'Lauch',a:'1',u:'Stk'}]}
];
var plan = {};
var tab = 'plan';
var modal = null;
var newDish = null;
var DAYS = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
var SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
var UNITS = ['g','kg','ml','L','EL','TL','Stk','Bund','Prise','Zehen','Dose'];
var EMOJIS = ['🍝','🍛','🥣','🍲','🥗','🍕','🌮','🍣','🥘','🍜','🥩','🐟','🥞','🍳'];
var nextId = 10;
var toastTimer = null;

function uid(){ return ++nextId; }

function render(){
  var app = document.getElementById('app');
  app.innerHTML = '';

  // HEADER
  var hdr = el('div',{className:'hdr'});
  var sub = tab==='plan'?'Wochenplan':tab==='dishes'?'Meine Gerichte':'Einkaufsliste';
  var title = tab==='plan'?'Diese Woche':tab==='dishes'?(dishes.length+' Gerichte'):(getShoppingList().length+' Artikel');
  hdr.innerHTML = '<div class="hdr-sub">'+sub+'</div><div class="hdr-title">'+title+'</div>';
  if(tab==='plan'){
    var rb = el('button',{className:'hdr-btn',onclick:randomPlan});
    rb.textContent = '🎲 Zufaelligen Plan';
    hdr.appendChild(rb);
  }
  if(tab==='dishes'){
    var ab = el('button',{className:'hdr-btn',onclick:openAdd});
    ab.textContent = '+ Neues Gericht';
    hdr.appendChild(ab);
  }
  app.appendChild(hdr);

  // CONTENT
  var content = el('div',{className:'content'});

  if(tab==='plan'){
    DAYS.forEach(function(day,i){
      var dish = dishes.find(function(d){ return d.id===plan[i]; });
      var card = el('div',{className:'card'});
      var row = el('div',{className:'card-row'});
      var ico = el('div',{className:'icon '+(dish?'icon-active':'icon-empty')});
      ico.textContent = dish ? dish.emoji : '📅';
      var info = el('div',{style:'flex:1;min-width:0'});
      info.innerHTML = '<div class="day-label">'+SHORT[i]+'</div><div class="dish-name" style="color:'+(dish?'#1C1C1E':'#8E8E93')+'">'+((dish?dish.name:'Kein Gericht'))+'</div>';
      var btns = el('div',{style:'display:flex;gap:6px'});
      if(dish){
        var db = el('button',{className:'btn-del'});
        db.textContent = 'x';
        db.onclick = (function(idx){ return function(){ delete plan[idx]; render(); }; })(i);
        btns.appendChild(db);
      }
      var pb = el('button',{className:'btn-add'});
      pb.textContent = '+';
      pb.onclick = (function(idx){ return function(){ openPicker(idx); }; })(i);
      btns.appendChild(pb);
      row.appendChild(ico); row.appendChild(info); row.appendChild(btns);
      card.appendChild(row);
      if(dish){
        var tags = el('div',{className:'tags'});
        dish.ings.slice(0,3).forEach(function(ing){
          var t = el('span',{className:'tag'}); t.textContent=ing.n; tags.appendChild(t);
        });
        if(dish.ings.length>3){ var tm=el('span',{className:'tag-more'}); tm.textContent='+'+(dish.ings.length-3); tags.appendChild(tm); }
        card.appendChild(tags);
      }
      content.appendChild(card);
    });
  }

  if(tab==='dishes'){
    if(!dishes.length){
      var emp = el('div',{className:'empty'});
      emp.innerHTML='<div class="empty-ico">🍽️</div><div class="empty-txt">Noch keine Gerichte</div>';
      content.appendChild(emp);
    }
    var inPlan = new Set(Object.values(plan));
    dishes.forEach(function(dish){
      var btn = el('button',{className:'dish-btn'});
      var dico = el('div',{className:'dish-icon'}); dico.textContent=dish.emoji;
      var dinfo = el('div',{style:'flex:1'}); dinfo.innerHTML='<div style="font-size:16px;font-weight:600;color:#1C1C1E">'+dish.name+'</div><div style="font-size:13px;color:#8E8E93;margin-top:2px">'+dish.ings.length+' Zutaten</div>';
      btn.appendChild(dico); btn.appendChild(dinfo);
      if(inPlan.has(dish.id)){ var b=el('span',{className:'badge'}); b.textContent='Im Plan'; btn.appendChild(b); }
      var arr=el('span',{className:'arrow'}); arr.textContent='>'; btn.appendChild(arr);
      btn.onclick=(function(d){ return function(){ openDetail(d); }; })(dish);
      content.appendChild(btn);
    });
  }

  if(tab==='shopping'){
    var sl = getShoppingList();
    if(!sl.length){
      var se=el('div',{className:'empty'});
      se.innerHTML='<div class="empty-ico">🛒</div><div class="empty-txt">Liste ist leer</div>';
      content.appendChild(se);
    } else {
      var sc=el('div',{className:'card'});
      sl.forEach(function(item,i){
        var row2=el('div',{className:'shop-row'});
        if(i===sl.length-1) row2.style.borderBottom='none';
        var dot=el('div',{className:'shop-dot'});
        var info2=el('div',{style:'flex:1'});
        info2.innerHTML='<div style="font-size:16px;font-weight:500;color:#1C1C1E">'+item.name+'</div><div style="font-size:12px;color:#8E8E93">'+item.dishes.join(', ')+'</div>';
        var amt=el('div',{className:'shop-amt'});
        var a=item.amount; amt.textContent=(a%1===0?a:a.toFixed(1))+' '+item.unit;
        row2.appendChild(dot); row2.appendChild(info2); row2.appendChild(amt);
        sc.appendChild(row2);
      });
      content.appendChild(sc);
    }
  }

  app.appendChild(content);

  // TABBAR
  var tb=el('div',{className:'tabbar'});
  [['plan','📅','Plan'],['dishes','🍽️','Gerichte'],['shopping','🛒','Einkauf']].forEach(function(t){
    var btn=el('button',{className:'tab-btn'});
    btn.innerHTML='<span class="tab-ico">'+t[1]+'</span><span class="tab-lbl" style="font-weight:'+(tab===t[0]?700:400)+';color:'+(tab===t[0]?'#FF6B35':'#8E8E93')+'">'+t[2]+'</span>';
    btn.onclick=(function(id){ return function(){ tab=id; render(); }; })(t[0]);
    tb.appendChild(btn);
  });
  app.appendChild(tb);

  // MODALS
  if(modal&&modal.type==='picker'){
    renderPicker();
  } else if(modal&&modal.type==='detail'){
    renderDetail();
  } else if(modal&&modal.type==='add'){
    renderAdd();
  }
}

function renderPicker(){
  var ov=el('div',{className:'overlay'});
  ov.onclick=closeModal;
  var sh=el('div',{className:'sheet'});
  sh.onclick=function(e){e.stopPropagation();};
  sh.innerHTML='<div class="sheet-handle"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="sheet-title" style="margin:0">Gericht fuer '+DAYS[modal.day]+'</div><button class="sheet-close" onclick="closeModal()">x</button></div>';
  dishes.forEach(function(dish){
    var btn=el('button',{className:'picker-btn'+(plan[modal.day]===dish.id?' active':'')});
    btn.innerHTML='<span style="font-size:22px;margin-right:12px">'+dish.emoji+'</span>'+dish.name;
    if(plan[modal.day]===dish.id) btn.innerHTML+='<span style="margin-left:auto;color:#FF6B35">&#10003;</span>';
    btn.onclick=(function(id){ return function(){ plan[modal.day]=id; closeModal(); toast('Zugewiesen!'); }; })(dish.id);
    sh.appendChild(btn);
  });
  ov.appendChild(sh);
  document.getElementById('app').appendChild(ov);
}

function renderDetail(){
  var d=modal.dish;
  var ov=el('div',{className:'overlay'});
  ov.onclick=closeModal;
  var sh=el('div',{className:'sheet'});
  sh.onclick=function(e){e.stopPropagation();};
  sh.innerHTML='<div class="sheet-handle"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="sheet-title" style="margin:0">'+d.emoji+' '+d.name+'</div><button class="sheet-close" onclick="closeModal()">x</button></div>';
  d.ings.forEach(function(ing,i){
    var row=el('div',{className:'ing-detail'});
    if(i===d.ings.length-1) row.style.borderBottom='none';
    row.innerHTML='<span style="font-size:15px">'+ing.n+'</span><span style="font-size:15px;font-weight:600;color:#FF6B35">'+ing.a+' '+ing.u+'</span>';
    sh.appendChild(row);
  });
  var db=el('button',{className:'del-btn'});
  db.textContent='Gericht loeschen';
  db.onclick=function(){
    dishes=dishes.filter(function(x){ return x.id!==d.id; });
    Object.keys(plan).forEach(function(k){ if(plan[k]===d.id) delete plan[k]; });
    closeModal(); toast('Geloescht');
  };
  sh.appendChild(db);
  ov.appendChild(sh);
  document.getElementById('app').appendChild(ov);
}

function renderAdd(){
  var ov=el('div',{className:'overlay'});
  ov.onclick=closeModal;
  var sh=el('div',{className:'sheet'});
  sh.onclick=function(e){e.stopPropagation();};
  var hd=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px'});
  hd.innerHTML='<div class="sheet-handle" style="display:none"></div><div style="font-size:18px;font-weight:700">Neues Gericht</div>';
  var cb=el('button',{className:'sheet-close'}); cb.textContent='x'; cb.onclick=closeModal;
  hd.appendChild(cb);
  sh.appendChild(el('div',{className:'sheet-handle'}));
  sh.appendChild(hd);

  // Emoji
  var el2=document.createElement('label'); el2.className='lbl'; el2.textContent='EMOJI'; sh.appendChild(el2);
  var eg=el('div',{className:'emoji-grid'});
  EMOJIS.forEach(function(e){
    var eb=document.createElement('button'); eb.className='emoji-btn'+(newDish.emoji===e?' sel':'');
    eb.textContent=e;
    eb.onclick=function(){ newDish.emoji=e; renderAdd2(sh); };
    eg.appendChild(eb);
  });
  sh.appendChild(eg);

  // Name
  var nl=document.createElement('label'); nl.className='lbl'; nl.textContent='NAME'; sh.appendChild(nl);
  var ni=el('input',{className:'inp',placeholder:'z.B. Gemuesepfanne',value:newDish.name||''});
  ni.oninput=function(){ newDish.name=this.value; };
  sh.appendChild(ni);

  // Zutaten
  var il=document.createElement('label'); il.className='lbl'; il.textContent='ZUTATEN';
  var addib=el('button',{style:'float:right;background:#FFF0EB;border:none;border-radius:8px;color:#FF6B35;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px'});
  addib.textContent='+ Mehr';
  addib.onclick=function(){ newDish.ings.push({id:uid(),n:'',a:'',u:'g'}); renderAdd2(sh); };
  sh.appendChild(addib);
  sh.appendChild(il);

  newDish.ings.forEach(function(ing){
    var row=el('div',{className:'ing-row'});
    var ni2=el('input',{className:'inp',placeholder:'Zutat',value:ing.n||'',style:'flex:2'});
    ni2.oninput=(function(i){ return function(){ i.n=this.value; }; })(ing);
    var ai=el('input',{className:'inp',placeholder:'Menge',value:ing.a||'',type:'number',style:'flex:1'});
    ai.oninput=(function(i){ return function(){ i.a=this.value; }; })(ing);
    var us=document.createElement('select'); us.className='sel'; us.style.flex='1';
    UNITS.forEach(function(u){ var o=document.createElement('option'); o.value=u; o.textContent=u; if(u===ing.u) o.selected=true; us.appendChild(o); });
    us.onchange=(function(i){ return function(){ i.u=this.value; }; })(ing);
    row.appendChild(ni2); row.appendChild(ai); row.appendChild(us);
    if(newDish.ings.length>1){
      var rb2=el('button',{style:'background:none;border:none;color:#FF3B30;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0'});
      rb2.textContent='x';
      rb2.onclick=(function(id){ return function(){ newDish.ings=newDish.ings.filter(function(x){ return x.id!==id; }); renderAdd2(sh); }; })(ing.id);
      row.appendChild(rb2);
    }
    sh.appendChild(row);
  });

  var sb=el('button',{className:'save-btn'});
  sb.textContent='Gericht speichern';
  sb.onclick=function(){
    if(!newDish.name.trim()) return toast('Bitte Name eingeben');
    var ings=newDish.ings.filter(function(i){ return i.n.trim(); });
    if(!ings.length) return toast('Mind. 1 Zutat');
    dishes.push({id:uid(),name:newDish.name,emoji:newDish.emoji,ings:ings});
    closeModal(); toast('Gespeichert!');
  };
  sh.appendChild(sb);
  ov.appendChild(sh);
  document.getElementById('app').appendChild(ov);
}

function renderAdd2(sh){
  var ov=sh.parentNode;
  ov.removeChild(sh);
  modal={type:'add'};
  renderAdd();
}

function el(tag,props){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    if(k==='style'&&typeof props[k]==='string') e.style.cssText=props[k];
    else if(k==='className') e.className=props[k];
    else if(k.startsWith('on')) e[k]=props[k];
    else e.setAttribute(k,props[k]);
  });
  return e;
}

function getShoppingList(){
  var t={};
  Object.values(plan).forEach(function(id){
    var d=dishes.find(function(x){ return x.id===id; }); if(!d) return;
    d.ings.forEach(function(ing){
      var k=ing.n+'__'+ing.u;
      if(!t[k]) t[k]={name:ing.n,unit:ing.u,amount:0,dishes:[]};
      t[k].amount+=parseFloat(ing.a)||0;
      if(t[k].dishes.indexOf(d.name)<0) t[k].dishes.push(d.name);
    });
  });
  return Object.values(t).sort(function(a,b){ return a.name.localeCompare(b.name); });
}

function randomPlan(){
  if(!dishes.length) return toast('Keine Gerichte!');
  DAYS.forEach(function(_,i){ plan[i]=dishes[Math.floor(Math.random()*dishes.length)].id; });
  render(); toast('Zufaelliger Plan erstellt!');
}

function openPicker(i){ modal={type:'picker',day:i}; render(); }
function openDetail(d){ modal={type:'detail',dish:d}; render(); }
function openAdd(){ newDish={name:'',emoji:'🍝',ings:[{id:uid(),n:'',a:'',u:'g'}]}; modal={type:'add'}; render(); }
function closeModal(){ modal=null; render(); }

function toast(msg){
  var existing=document.querySelector('.toast');
  if(existing) existing.remove();
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2200);
}

render();
</script>
</body>
</html>
