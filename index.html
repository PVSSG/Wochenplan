<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Wochenplaner"/>
<meta name="theme-color" content="#FF6B35"/>
<title>Wochenplaner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
input,select,button{font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,createElement:h} = React;
const DAYS = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const UNITS = ['g','kg','ml','L','EL','TL','Stk','Bund','Prise','Zehen','Dose'];
const EMOJIS = ['🍝','🍛','🥣','🍲','🥗','🍕','🌮','🍣','🥘','🍜','🥩','🐟','🫕','🥞','🍳'];
const uid = () => Math.random().toString(36).slice(2);
const INIT = [
  {id:1,name:'Spaghetti Bolognese',emoji:'🍝',ingredients:[{name:'Spaghetti',amount:'400',unit:'g'},{name:'Rinderhackfleisch',amount:'500',unit:'g'},{name:'Tomaten',amount:'400',unit:'g'},{name:'Zwiebel',amount:'1',unit:'Stk'},{name:'Knoblauch',amount:'2',unit:'Zehen'}]},
  {id:2,name:'Haehnchen Curry',emoji:'🍛',ingredients:[{name:'Haehnchenbrust',amount:'600',unit:'g'},{name:'Kokosmilch',amount:'400',unit:'ml'},{name:'Currypaste',amount:'2',unit:'EL'},{name:'Reis',amount:'300',unit:'g'}]},
  {id:3,name:'Gemuesesuppe',emoji:'🥣',ingredients:[{name:'Karotten',amount:'3',unit:'Stk'},{name:'Kartoffeln',amount:'4',unit:'Stk'},{name:'Bruehe',amount:'1.5',unit:'L'},{name:'Lauch',amount:'1',unit:'Stk'}]}
];

function Modal({onClose,title,children}){
return h(‘div’,{onClick:onClose,style:{position:‘fixed’,inset:0,background:‘rgba(0,0,0,0.45)’,display:‘flex’,alignItems:‘flex-end’,justifyContent:‘center’,zIndex:500}},
h(‘div’,{onClick:e=>e.stopPropagation(),style:{background:’#fff’,borderRadius:‘24px 24px 0 0’,width:‘100%’,maxWidth:430,maxHeight:‘90vh’,overflowY:‘auto’,padding:‘20px 20px 40px’}},
h(‘div’,{style:{width:36,height:4,background:’#E5E5EA’,borderRadius:2,margin:‘0 auto 16px’}}),
h(‘div’,{style:{display:‘flex’,justifyContent:‘space-between’,alignItems:‘center’,marginBottom:16}},
h(‘div’,{style:{fontSize:18,fontWeight:700}},title),
h(‘button’,{onClick:onClose,style:{background:’#F2F2F7’,border:‘none’,borderRadius:‘50%’,width:30,height:30,fontSize:16,cursor:‘pointer’,color:’#8E8E93’}},‘x’)
),
children
)
);
}

function App(){
const [tab,setTab] = useState(‘plan’);
const [dishes,setDishes] = useState(INIT);
const [plan,setPlan] = useState({});
const [picker,setPicker] = useState(null);
const [detail,setDetail] = useState(null);
const [adding,setAdding] = useState(false);
const [nd,setNd] = useState({name:’’,emoji:‘🍽️’,ingredients:[{id:uid(),name:’’,amount:’’,unit:‘g’}]});
const [toast,setToast] = useState(null);

const notify = msg => { setToast(msg); setTimeout(()=>setToast(null),2200); };

const randomPlan = () => {
if(!dishes.length) return notify(‘Keine Gerichte vorhanden!’);
const p={};
DAYS.forEach((_,i)=>{ p[i]=dishes[Math.floor(Math.random()*dishes.length)].id; });
setPlan(p); notify(‘Zufaelliger Plan erstellt!’);
};

const shopping = () => {
const t={};
Object.values(plan).forEach(id=>{
const d=dishes.find(x=>x.id===id); if(!d) return;
d.ingredients.forEach(ing=>{
const k=ing.name+’__’+ing.unit;
if(!t[k]) t[k]={name:ing.name,unit:ing.unit,amount:0,dishes:[]};
t[k].amount+=parseFloat(ing.amount)||0;
if(!t[k].dishes.includes(d.name)) t[k].dishes.push(d.name);
});
});
return Object.values(t).sort((a,b)=>a.name.localeCompare(b.name));
};

const saveDish = () => {
if(!nd.name.trim()) return notify(‘Bitte Name eingeben’);
const ings=nd.ingredients.filter(i=>i.name.trim());
if(!ings.length) return notify(‘Mind. 1 Zutat angeben’);
setDishes(d=>[…d,{…nd,id:uid(),ingredients:ings}]);
setAdding(false);
setNd({name:’’,emoji:‘🍽️’,ingredients:[{id:uid(),name:’’,amount:’’,unit:‘g’}]});
notify(‘Gericht gespeichert!’);
};

const deleteDish = id => {
setDishes(d=>d.filter(x=>x.id!==id));
const p={…plan}; Object.keys(p).forEach(k=>{ if(p[k]===id) delete p[k]; }); setPlan(p);
setDetail(null); notify(‘Gericht geloescht’);
};

const addIng = () => setNd(d=>({…d,ingredients:[…d.ingredients,{id:uid(),name:’’,amount:’’,unit:‘g’}]}));
const removeIng = rid => setNd(d=>({…d,ingredients:d.ingredients.filter(i=>i.id!==rid)}));
const updateIng = (rid,f,v) => setNd(d=>({…d,ingredients:d.ingredients.map(i=>i.id===rid?{…i,[f]:v}:i)}));

const sl=shopping();
const inPlan=new Set(Object.values(plan));
const s=(styles)=>styles;

const HDR = {background:‘linear-gradient(135deg,#FF6B35 0%,#FF8C61 100%)’,padding:‘52px 20px 24px’,color:’#fff’};
const CARD = {background:’#fff’,borderRadius:16,marginBottom:10,overflow:‘hidden’,boxShadow:‘0 1px 3px rgba(0,0,0,0.06)’};
const BTN_SM = {background:‘rgba(255,255,255,0.22)’,border:‘1px solid rgba(255,255,255,0.35)’,borderRadius:20,color:’#fff’,padding:‘8px 18px’,fontSize:14,fontWeight:600,cursor:‘pointer’,marginTop:14};

return h(‘div’,{style:{fontFamily:’-apple-system,BlinkMacSystemFont,sans-serif’,background:’#F2F2F7’,minHeight:‘100vh’,maxWidth:430,margin:‘0 auto’,paddingBottom:90}},

```
// HEADER
h('div',{style:HDR},
  h('div',{style:{fontSize:13,fontWeight:600,letterSpacing:2,opacity:0.85,textTransform:'uppercase',marginBottom:4}},
    tab==='plan'?'Wochenplan':tab==='dishes'?'Meine Gerichte':'Einkaufsliste'),
  h('div',{style:{fontSize:34,fontWeight:700,letterSpacing:-1}},
    tab==='plan'?'Diese Woche':tab==='dishes'?dishes.length+' Gerichte':sl.length+' Artikel'),
  tab==='plan' && h('button',{onClick:randomPlan,style:BTN_SM},'🎲 Zufaelligen Plan'),
  tab==='dishes' && h('button',{onClick:()=>setAdding(true),style:BTN_SM},'+ Neues Gericht')
),

// PLAN TAB
tab==='plan' && h('div',{style:{padding:'16px 16px 0'}},
  DAYS.map((_,i)=>{
    const dish=dishes.find(d=>d.id===plan[i]);
    return h('div',{key:i,style:CARD},
      h('div',{style:{display:'flex',alignItems:'center',padding:'12px 14px'}},
        h('div',{style:{width:40,height:40,borderRadius:10,background:dish?'linear-gradient(135deg,#FF6B35,#FF8C61)':'#F2F2F7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,marginRight:12,flexShrink:0}},dish?dish.emoji:'📅'),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontSize:12,color:'#8E8E93',fontWeight:600,textTransform:'uppercase'}},SHORT[i]),
          h('div',{style:{fontSize:16,fontWeight:600,color:dish?'#1C1C1E':'#8E8E93',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},dish?dish.name:'Kein Gericht')
        ),
        h('div',{style:{display:'flex',gap:6}},
          dish && h('button',{onClick:()=>{const p={...plan};delete p[i];setPlan(p);},style:{background:'#FF3B30',border:'none',borderRadius:8,color:'#fff',width:30,height:30,cursor:'pointer'}},'x'),
          h('button',{onClick:()=>setPicker(i),style:{background:'#F2F2F7',border:'none',borderRadius:8,color:'#FF6B35',width:30,height:30,fontSize:18,cursor:'pointer',fontWeight:700}},'+')
        )
      ),
      dish && h('div',{style:{padding:'0 14px 10px',display:'flex',gap:6,flexWrap:'wrap'}},
        dish.ingredients.slice(0,3).map((ing,j)=>h('span',{key:j,style:{background:'#FFF0EB',color:'#FF6B35',borderRadius:8,padding:'2px 8px',fontSize:11,fontWeight:500}},ing.name)),
        dish.ingredients.length>3 && h('span',{style:{background:'#F2F2F7',color:'#8E8E93',borderRadius:8,padding:'2px 8px',fontSize:11}},'+'+( dish.ingredients.length-3))
      )
    );
  })
),

// DISHES TAB
tab==='dishes' && h('div',{style:{padding:'16px 16px 0'}},
  !dishes.length && h('div',{style:{textAlign:'center',padding:'60px 20px',color:'#8E8E93'}},
    h('div',{style:{fontSize:50,marginBottom:12}},'🍽️'),
    h('div',{style:{fontSize:17,fontWeight:600}},'Noch keine Gerichte')
  ),
  dishes.map(dish=>h('button',{key:dish.id,onClick:()=>setDetail(dish),style:{display:'flex',alignItems:'center',width:'100%',background:'#fff',border:'none',borderRadius:16,marginBottom:10,padding:14,cursor:'pointer',boxShadow:'0 1px 3px rgba(0,0,0,0.06)',textAlign:'left'}},
    h('div',{style:{width:48,height:48,borderRadius:12,background:'linear-gradient(135deg,#FF6B35,#FF8C61)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,marginRight:14,flexShrink:0}},dish.emoji),
    h('div',{style:{flex:1}},
      h('div',{style:{fontSize:16,fontWeight:600,color:'#1C1C1E'}},dish.name),
      h('div',{style:{fontSize:13,color:'#8E8E93',marginTop:2}},dish.ingredients.length+' Zutaten')
    ),
    inPlan.has(dish.id) && h('span',{style:{background:'#E8F9F0',color:'#34C759',borderRadius:8,padding:'3px 8px',fontSize:11,fontWeight:600}},'Im Plan'),
    h('span',{style:{color:'#C7C7CC',fontSize:18,marginLeft:8}},String.fromCharCode(8250))
  ))
),

// SHOPPING TAB
tab==='shopping' && h('div',{style:{padding:'16px 16px 0'}},
  !sl.length
    ? h('div',{style:{textAlign:'center',padding:'60px 20px',color:'#8E8E93'}},h('div',{style:{fontSize:50,marginBottom:12}},'🛒'),h('div',{style:{fontSize:17,fontWeight:600}},'Liste ist leer'))
    : h('div',{style:{background:'#fff',borderRadius:16,overflow:'hidden',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}},
        sl.map((item,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',padding:'13px 16px',borderBottom:i<sl.length-1?'1px solid #F2F2F7':'none'}},
          h('div',{style:{width:8,height:8,borderRadius:'50%',background:'#FF6B35',marginRight:12,flexShrink:0}}),
          h('div',{style:{flex:1}},
            h('div',{style:{fontSize:16,fontWeight:500,color:'#1C1C1E'}},item.name),
            h('div',{style:{fontSize:12,color:'#8E8E93'}},item.dishes.join(', '))
          ),
          h('div',{style:{fontSize:15,fontWeight:600,color:'#FF6B35'}},(item.amount%1===0?item.amount:item.amount.toFixed(1))+' '+item.unit)
        ))
      )
),

// TAB BAR
h('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'rgba(255,255,255,0.95)',borderTop:'1px solid rgba(0,0,0,0.08)',display:'flex',padding:'8px 0 20px',zIndex:100}},
  [['plan','📅','Plan'],['dishes','🍽️','Gerichte'],['shopping','🛒','Einkauf']].map(([id,ico,label])=>
    h('button',{key:id,onClick:()=>setTab(id),style:{flex:1,border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 0'}},
      h('span',{style:{fontSize:22}},ico),
      h('span',{style:{fontSize:10,fontWeight:tab===id?700:400,color:tab===id?'#FF6B35':'#8E8E93'}},label)
    )
  )
),

// PICKER MODAL
picker!==null && h(Modal,{onClose:()=>setPicker(null),title:'Gericht fuer '+DAYS[picker]},
  dishes.map(dish=>h('button',{key:dish.id,onClick:()=>{setPlan(p=>({...p,[picker]:dish.id}));setPicker(null);notify('Zugewiesen!');},style:{display:'flex',alignItems:'center',width:'100%',background:plan[picker]===dish.id?'#FFF0EB':'#F8F8F8',border:'none',borderRadius:12,marginBottom:8,padding:12,cursor:'pointer'}},
    h('span',{style:{fontSize:22,marginRight:12}},dish.emoji),
    h('span',{style:{fontSize:15,fontWeight:500,flex:1,textAlign:'left'}},dish.name),
    plan[picker]===dish.id && h('span',{style:{color:'#FF6B35'}},'✓')
  ))
),

// DETAIL MODAL
detail && h(Modal,{onClose:()=>setDetail(null),title:detail.emoji+' '+detail.name},
  detail.ingredients.map((ing,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:i<detail.ingredients.length-1?'1px solid #F2F2F7':'none'}},
    h('span',{style:{fontSize:15}},ing.name),
    h('span',{style:{fontSize:15,fontWeight:600,color:'#FF6B35'}},ing.amount+' '+ing.unit)
  )),
  h('button',{onClick:()=>deleteDish(detail.id),style:{width:'100%',background:'#FF3B30',border:'none',borderRadius:12,color:'#fff',padding:13,fontSize:15,fontWeight:600,cursor:'pointer',marginTop:16}},'Gericht loeschen')
),

// ADD MODAL
adding && h(Modal,{onClose:()=>setAdding(false),title:'Neues Gericht'},
  h('div',{style:{marginBottom:14}},
    h('label',{style:{fontSize:13,color:'#8E8E93',fontWeight:600,display:'block',marginBottom:6}},'EMOJI'),
    h('div',{style:{display:'flex',flexWrap:'wrap',gap:6,background:'#F8F8F8',borderRadius:12,padding:10}},
      EMOJIS.map(e=>h('button',{key:e,onClick:()=>setNd(d=>({...d,emoji:e})),style:{fontSize:22,background:nd.emoji===e?'#FF6B35':'transparent',border:'none',borderRadius:8,width:36,height:36,cursor:'pointer'}},e))
    )
  ),
  h('div',{style:{marginBottom:14}},
    h('label',{style:{fontSize:13,color:'#8E8E93',fontWeight:600,display:'block',marginBottom:6}},'NAME'),
    h('input',{value:nd.name,onChange:e=>setNd(d=>({...d,name:e.target.value})),placeholder:'z.B. Gemuesepfanne',style:{width:'100%',padding:12,borderRadius:12,border:'1px solid #E5E5EA',fontSize:15,outline:'none'}})
  ),
  h('div',{style:{marginBottom:16}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
      h('label',{style:{fontSize:13,color:'#8E8E93',fontWeight:600}},'ZUTATEN'),
      h('button',{onClick:addIng,style:{background:'#FFF0EB',border:'none',borderRadius:8,color:'#FF6B35',padding:'4px 10px',fontSize:12,fontWeight:600,cursor:'pointer'}},'+ Mehr')
    ),
    nd.ingredients.map(ing=>h('div',{key:ing.id,style:{display:'flex',gap:6,marginBottom:6}},
      h('input',{value:ing.name,onChange:e=>updateIng(ing.id,'name',e.target.value),placeholder:'Zutat',style:{flex:2,padding:10,borderRadius:10,border:'1px solid #E5E5EA',fontSize:13,outline:'none'}}),
      h('input',{value:ing.amount,onChange:e=>updateIng(ing.id,'amount',e.target.value),placeholder:'Menge',type:'number',style:{flex:1,padding:10,borderRadius:10,border:'1px solid #E5E5EA',fontSize:13,outline:'none'}}),
      h('select',{value:ing.unit,onChange:e=>updateIng(ing.id,'unit',e.target.value),style:{flex:1,padding:10,borderRadius:10,border:'1px solid #E5E5EA',fontSize:12,outline:'none',background:'#fff'}},
        UNITS.map(u=>h('option',{key:u},u))
      ),
      nd.ingredients.length>1 && h('button',{onClick:()=>removeIng(ing.id),style:{background:'none',border:'none',color:'#FF3B30',fontSize:18,cursor:'pointer',padding:'4px',flexShrink:0}},'x')
    ))
  ),
  h('button',{onClick:saveDish,style:{width:'100%',background:'linear-gradient(135deg,#FF6B35,#FF8C61)',border:'none',borderRadius:12,color:'#fff',padding:14,fontSize:16,fontWeight:700,cursor:'pointer'}},'Gericht speichern')
),

// TOAST
toast && h('div',{style:{position:'fixed',bottom:100,left:'50%',transform:'translateX(-50%)',background:'rgba(28,28,30,0.9)',color:'#fff',borderRadius:20,padding:'10px 20px',fontSize:14,fontWeight:500,zIndex:999,whiteSpace:'nowrap'}},toast)
```

);
}

ReactDOM.createRoot(document.getElementById(‘root’)).render(React.createElement(App));
</script>

</body>
</html>
